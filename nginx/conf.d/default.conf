# ==============================================================================
# Port 80: HTTP Server Block (Redirect to HTTPS & Let's Encrypt Verification)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name sportiverf.com www.sportiverf.com localhost;

    # ACME Let's Encrypt challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Container Healthcheck Endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","timestamp":"$time_iso8601","service":"sportiverf-web"}';
    }

    # Redirect all HTTP traffic to HTTPS (If certificates exist)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# Port 443: HTTPS Production Server Block
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sportiverf.com www.sportiverf.com;

    root /usr/share/nginx/html;
    index index.html;

    # SSL Certificates (Managed by Certbot on VPS)
    ssl_certificate /etc/letsencrypt/live/sportiverf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportiverf.com/privkey.pem;

    # SSL Parameters & Security Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cms.sportiverf.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.sportiverf.com https://cms.sportiverf.com; frame-ancestors 'self';" always;

    # Rate Limiting
    limit_req zone=req_limit_per_ip burst=20 nodelay;
    limit_conn conn_limit_per_ip 20;

    # Health Check Endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","timestamp":"$time_iso8601","service":"sportiverf-web"}';
    }

    # Immutable Asset Caching for Astro Bundled Files (/_astro/*)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Media and Image Caching
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # Font Caching
    location ~* \.(?:ttf|ttc|otf|eot|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static HTML revalidation
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Custom Error Pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
