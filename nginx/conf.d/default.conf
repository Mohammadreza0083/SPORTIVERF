# ==============================================================================
# Port 80: HTTP Web Server Block & Health Check Endpoint
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name sportiverf.com www.sportiverf.com localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # Container Healthcheck Endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","timestamp":"$time_iso8601","service":"sportiverf-web"}';
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Immutable Asset Caching for Astro Bundled Files (/_astro/*)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Media and Image Caching
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # Font Caching
    location ~* \.(?:ttf|ttc|otf|eot|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static HTML revalidation
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Custom Error Pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
