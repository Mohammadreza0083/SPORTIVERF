# ==============================================================================
# Port 80: HTTP Web Server Block & Health Check Endpoint
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name sportiverf.com www.sportiverf.com localhost _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Container Healthcheck Endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","timestamp":"$time_iso8601","service":"sportiverf-web"}';
    }

    # Maintenance / Interceptor Route (HTTP 503 Service Unavailable with Retry-After)
    location = /en/camps/volleyball {
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503;
    }

    # Global Server-level Security Headers (inherited by locations without local add_header)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.telegram.org https://vitals.vercel-insights.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Immutable Asset Caching for Astro Bundled Files (/_astro/*)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Media and Image Caching
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Font Caching
    location ~* \.(?:ttf|ttc|otf|eot|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Static HTML Delivery & Security Headers (prevents Nginx header inheritance drop)
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.telegram.org https://vitals.vercel-insights.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # Custom Error Pages
    error_page 404 /404.html;
    error_page 500 502 504 /500.html;
    error_page 503 =503 @maintenance_503;

    location @maintenance_503 {
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /coming-soon/index.html =503;
    }
}
