version: '3.8'

services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sportiverf-dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.astro
    environment:
      - NODE_ENV=development
      - PORT=4321
      - HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - sportiverf-dev-net

networks:
  sportiverf-dev-net:
    driver: bridge
