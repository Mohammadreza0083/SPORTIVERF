services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sportiverf-web:latest
    container_name: sportiverf-prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      - NODE_ENV=production
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - web-logs:/var/log/nginx
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:80/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - sportiverf-prod-net

networks:
  sportiverf-prod-net:
    driver: bridge

volumes:
  web-logs:
