name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8921060827:AAHUNo_mdKGBwTlbysIf3nbBYd3BIX9k1Pw' }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '269309616' }}

jobs:
  # ============================================================================
  # JOB 1: Code Quality, Type Checks & Static Build
  # ============================================================================
  quality-checks:
    name: Code Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Send Telegram - Build Started
        continue-on-error: true
        run: |
          chmod +x ./scripts/telegram-notify.sh || true
          ./scripts/telegram-notify.sh "BUILD_START" "Build Started" "Commit: ${{ github.sha }} on branch ${{ github.ref_name }}" || true

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Type Check
        run: npm run check

      - name: Run Application Build
        run: npm run build

      - name: Send Telegram - Build Succeeded
        if: success()
        continue-on-error: true
        run: |
          ./scripts/telegram-notify.sh "BUILD_SUCCESS" "Build Succeeded" "Linting, type checking, and Astro compilation passed cleanly." || true

      - name: Send Telegram - Build Failed
        if: failure()
        continue-on-error: true
        run: |
          ./scripts/telegram-notify.sh "BUILD_FAILED" "Build Failed" "Compilation or quality check error in workflow run." || true

  # ============================================================================
  # JOB 2: Zero-Downtime VPS Deployment & Rollback Engine
  # ============================================================================
  deploy-vps:
    name: VPS Production Deployment
    needs: quality-checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS Secrets Availability
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "VPS_HOST secret not configured in GitHub Repository. Skipping remote SSH deployment step."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram - Deployment Started
        if: steps.check_secrets.outputs.has_secrets == 'true'
        continue-on-error: true
        run: |
          chmod +x ./scripts/telegram-notify.sh || true
          ./scripts/telegram-notify.sh "DEPLOY_START" "Deployment Started" "Connecting via SSH to Linux VPS..." || true

      - name: SSH Deploy & Health Check Verification
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GITHUB_SHA
          script: |
            export TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
            export TELEGRAM_CHAT_ID="${TELEGRAM_CHAT_ID}"
            export GITHUB_SHA="${{ github.sha }}"

            # Navigate to production deployment path
            cd /opt/sportiverf || cd ~/sportiverf || exit 1

            # Pull latest repository changes
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Execute zero-downtime rolling deployment
            chmod +x deploy/deploy.sh scripts/telegram-notify.sh
            ./deploy/deploy.sh

      - name: Send Telegram - Deployment Succeeded
        if: steps.check_secrets.outputs.has_secrets == 'true' && success()
        continue-on-error: true
        run: |
          ./scripts/telegram-notify.sh "DEPLOY_SUCCESS" "Deployment Succeeded" "Live site is online, healthy, and serving traffic." || true

      - name: Send Telegram - Deployment Failed
        if: steps.check_secrets.outputs.has_secrets == 'true' && failure()
        continue-on-error: true
        run: |
          ./scripts/telegram-notify.sh "DEPLOY_FAILED" "Deployment Failed" "Errors encountered during VPS SSH execution. Check deployment logs." || true
