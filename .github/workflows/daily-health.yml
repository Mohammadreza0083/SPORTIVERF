name: Daily Health Report & Monitoring

on:
  schedule:
    # Runs daily at 08:00 UTC (11:30 IRST)
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8921060827:AAHUNo_mdKGBwTlbysIf3nbBYd3BIX9k1Pw' }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '269309616' }}

jobs:
  health-check:
    name: Uptime & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS Secrets Availability
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "VPS_HOST secret not configured. Skipping remote VPS health check."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Remote VPS Health Monitor
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/sportiverf || cd ~/sportiverf || exit 1
            chmod +x scripts/server-monitor.sh scripts/telegram-notify.sh
            ./scripts/server-monitor.sh --daily
