name: Daily Health Report & Monitoring

on:
  schedule:
    # Runs daily at 08:00 UTC (11:30 IRST)
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  health-check:
    name: Uptime & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Remote VPS Health Monitor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/sportiverf || cd ~/sportiverf
            chmod +x scripts/server-monitor.sh scripts/telegram-notify.sh
            ./scripts/server-monitor.sh --daily
